<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DotoriMaps — 도토리숲 지도</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #F5F5F5; --panel: #FFFFFF; --border: #CCCCCC; --border-dark: #999;
      --pink: #FF9EC4; --pink-dark: #E87BA8;
      --acorn: #C68B4A; --acorn-dark: #8B5E2E;
      --cream: #FFF8F0; --cream-dark: #F0E4D4;
      --text: #333; --text-light: #888;
      --blue: #A8D8FF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; width: 100vw; overflow: hidden;
      font-family: 'Dotum', 'Malgun Gothic', 'Malgun Gothic', sans-serif;
      background: var(--bg); display: flex; color: var(--text); font-size: 13px;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 380px; height: 100%; background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,.05);
    }
    .sidebar-header {
      background: linear-gradient(to bottom, #FFB8D4, var(--pink));
      color: #FFF; padding: 14px 16px; font-size: 18px; font-weight: bold;
      text-align: center; border-bottom: 2px solid var(--pink-dark);
      text-shadow: 0 1px 0 rgba(232,123,168,.4); letter-spacing: 1px;
    }
    .sidebar-header small { display: block; font-size: 10px; font-weight: normal; opacity: .85; letter-spacing: 2px; margin-top: 2px; }
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--cream); }
    .sidebar-tab {
      flex: 1; padding: 12px 0; text-align: center; font-size: 12px; font-weight: bold;
      color: var(--text-light); cursor: pointer; border-bottom: 3px solid transparent;
      transition: all .15s; user-select: none;
    }
    .sidebar-tab.active { color: var(--pink-dark); border-bottom-color: var(--pink); background: #FFF; }
    .sidebar-tab:hover:not(.active) { background: #FFF5EE; }

    .tab-content { flex: 1; overflow-y: auto; padding: 16px; display: none; flex-direction: column; gap: 14px; }
    .tab-content.active { display: flex; }

    /* ---------- CATEGORY GRID ---------- */
    .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cat-btn {
      background: var(--cream); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 4px; cursor: pointer; text-align: center; transition: all .15s;
      user-select: none;
    }
    .cat-btn:hover { background: #FFEEDD; border-color: var(--pink); transform: translateY(-1px); }
    .cat-btn:active { transform: translateY(0); }
    .cat-btn i { font-size: 16px; color: var(--acorn-dark); margin-bottom: 4px; display: block; }
    .cat-btn span { font-size: 10px; font-weight: bold; color: var(--text); }

    .section-title {
      font-size: 13px; font-weight: bold; color: var(--acorn-dark);
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .sort-chips { display: flex; gap: 4px; }
    .sort-chip {
      font-size: 10px; padding: 3px 8px; border-radius: 10px;
      border: 1px solid var(--border); background: #FFF; cursor: pointer;
      color: var(--text-light); transition: all .15s; font-family: inherit;
    }
    .sort-chip.active { background: var(--pink); border-color: var(--pink-dark); color: #FFF; font-weight: bold; }
    .sort-chip:hover:not(.active) { border-color: var(--pink); }

    /* ---------- SPINNER / EMPTY ---------- */
    .spinner {
      border: 3px solid #F0F0F0; border-top-color: var(--pink);
      border-radius: 50%; width: 24px; height: 24px;
      animation: spin 1s linear infinite; margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      font-size: 11px; color: var(--text-light); text-align: center;
      padding: 20px; line-height: 1.6;
    }
    .empty-state .em { color: var(--acorn-dark); font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; }

    /* ---------- PLACE CARDS ---------- */
    .place-card {
      background: #FFF; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; cursor: pointer; transition: all .15s;
      display: flex; gap: 10px; align-items: center;
    }
    .place-card:hover { border-color: var(--pink); box-shadow: 0 2px 8px rgba(232,123,168,.15); }
    .place-card:active { transform: scale(.99); }
    .place-card-icon {
      width: 34px; height: 34px; border-radius: 8px; background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--acorn-dark); flex-shrink: 0;
    }
    .place-card-body { flex: 1; min-width: 0; }
    .place-card h4 {
      font-size: 12px; color: var(--acorn-dark); margin-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .place-card p {
      font-size: 10px; color: var(--text-light);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ---------- INPUTS ---------- */
    .input-group { display: flex; flex-direction: column; gap: 5px; position: relative; }
    .input-group label {
      font-size: 11px; color: var(--acorn-dark);
      font-weight: bold; letter-spacing: .3px;
    }
    .search-box {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--cream); font-size: 13px;
      outline: none; font-family: inherit; color: var(--text);
    }
    .search-box:focus { border-color: var(--pink); background: #FFF; }
    .search-results-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: #FFF; border: 1px solid var(--border); border-radius: 8px;
      max-height: 240px; overflow-y: auto; z-index: 1010;
      display: none; flex-direction: column; margin-top: 4px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }
    .search-result-item {
      padding: 10px 12px; font-size: 12px; border-bottom: 1px solid #F0F0F0;
      cursor: pointer; transition: all .1s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover, .search-result-item.active {
      background: var(--cream); color: var(--pink-dark);
    }
    .search-result-item small { display: block; color: #AAA; font-size: 10px; margin-top: 1px; }

    .recent-label { font-size: 10px; color: #AAA; letter-spacing: 1px; margin-top: 4px; }
    .recent-searches { display: flex; flex-wrap: wrap; gap: 6px; }
    .recent-chip {
      font-size: 11px; padding: 5px 10px; border-radius: 12px;
      background: var(--cream); border: 1px solid var(--cream-dark);
      cursor: pointer; transition: all .15s; user-select: none;
    }
    .recent-chip:hover { background: #FFE8F0; border-color: var(--pink); }

    /* ---------- BUTTONS ---------- */
    .dotori-btn {
      padding: 12px 14px;
      background: linear-gradient(to bottom, #FFB8D4, var(--pink));
      border: 1px solid var(--pink-dark); border-radius: 8px;
      color: #FFF; font-weight: bold; font-size: 13px; cursor: pointer;
      text-shadow: 0 1px 0 rgba(232,123,168,.4);
      width: 100%; transition: all .15s; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .dotori-btn:hover:not(:disabled) { background: linear-gradient(to bottom, var(--pink), var(--pink-dark)); }
    .dotori-btn:active:not(:disabled) { transform: translateY(1px); }
    .dotori-btn:disabled { opacity: .55; cursor: wait; }

    .small-btn {
      padding: 8px 14px; font-size: 12px; border-radius: 8px;
      background: #FFF; border: 1px solid var(--border); color: var(--text);
      cursor: pointer; font-family: inherit; transition: all .15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .small-btn:hover { border-color: var(--pink); background: var(--cream); }
    .small-btn.saved { background: var(--pink); border-color: var(--pink-dark); color: #FFF; font-weight: bold; }
    .small-btn:disabled { opacity: .5; cursor: default; }

    /* ---------- MAP ---------- */
    #map { flex: 1; height: 100%; width: 100%; z-index: 1; background: #E5E3DF; }

    /* ---------- TOOLBOX ---------- */
    .map-toolbox {
      position: absolute; top: 16px; right: 16px; z-index: 1000;
      background: #FFF; border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--border);
    }
    .toolbox-btn {
      padding: 11px 14px; background: #FFF; border: none;
      border-bottom: 1px solid var(--border); cursor: pointer;
      font-size: 16px; color: var(--text); transition: all .15s;
      line-height: 1; min-width: 44px; text-align: center;
    }
    .toolbox-btn:last-child { border-bottom: none; }
    .toolbox-btn:hover { background: var(--cream); }
    .toolbox-btn.active { background: var(--cream-dark); }

    /* ---------- DETAIL PANEL ---------- */
    .detail-panel {
      position: absolute; bottom: -100%; left: 380px; right: 0;
      background: #FFF; border-top: 2px solid var(--pink);
      padding: 20px 24px 18px; z-index: 1000;
      transition: bottom .3s ease-in-out;
      box-shadow: 0 -4px 12px rgba(0,0,0,.1);
      display: flex; flex-direction: column; gap: 10px;
      max-height: 65vh; overflow-y: auto;
    }
    .detail-panel.open { bottom: 0; }
    .detail-close {
      position: absolute; top: 10px; right: 14px;
      background: none; border: none; font-size: 22px;
      cursor: pointer; color: #AAA; line-height: 1; padding: 4px;
    }
    .detail-close:hover { color: var(--pink-dark); }

    .detail-head { display: flex; gap: 14px; align-items: flex-start; }
    .detail-photo {
      width: 88px; height: 88px; border-radius: 10px;
      background: var(--cream); display: flex; align-items: center;
      justify-content: center; font-size: 42px; color: var(--acorn-dark);
      flex-shrink: 0; overflow: hidden;
    }
    .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
    .detail-head-text { flex: 1; min-width: 0; }
    .detail-title {
      font-size: 20px; font-weight: bold; color: var(--acorn-dark);
      line-height: 1.25; margin-bottom: 3px; word-break: break-word;
    }
    .detail-category {
      display: inline-block; font-size: 10px; padding: 2px 8px;
      border-radius: 10px; background: var(--cream); color: var(--acorn-dark);
      border: 1px solid var(--cream-dark); margin-bottom: 6px;
      letter-spacing: .3px;
    }
    .detail-subtitle { font-size: 11px; color: var(--text-light); line-height: 1.5; }

    .detail-facts { display: flex; flex-direction: column; gap: 5px; }
    .detail-fact {
      display: flex; gap: 8px; font-size: 12px; color: var(--text);
      align-items: flex-start; line-height: 1.4;
    }
    .detail-fact .fact-icon {
      width: 16px; flex-shrink: 0; color: var(--acorn-dark);
      text-align: center; font-size: 13px;
    }
    .detail-fact a { color: var(--pink-dark); text-decoration: none; word-break: break-all; }
    .detail-fact a:hover { text-decoration: underline; }

    .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .detail-actions .dotori-btn { width: auto; padding: 9px 16px; font-size: 12px; }

    .detail-nearby { border-top: 1px solid #F0F0F0; padding-top: 10px; margin-top: 4px; }
    .detail-nearby-title {
      font-size: 11px; font-weight: bold; color: var(--acorn-dark);
      margin-bottom: 6px; letter-spacing: .3px;
    }
    .detail-nearby-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .detail-nearby-chip {
      font-size: 11px; padding: 5px 10px; border-radius: 12px;
      background: var(--cream); border: 1px solid var(--cream-dark);
      cursor: pointer; color: var(--text); font-family: inherit;
      transition: all .15s; display: inline-flex; align-items: center; gap: 4px;
    }
    .detail-nearby-chip:hover { background: #FFE8F0; border-color: var(--pink); }
    .detail-nearby-chip .muted { color: #AAA; font-size: 10px; }

    /* ---------- MODAL ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #FFF; border: 1px solid var(--border-dark);
      border-radius: 6px; width: 100%; max-width: 420px;
      max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px;
      background: linear-gradient(to bottom, var(--cream), var(--cream-dark));
      border-bottom: 1px solid var(--border);
      border-radius: 6px 6px 0 0;
      font-size: 12px; font-weight: bold; color: var(--acorn-dark);
      letter-spacing: .3px;
    }
    .modal-close {
      background: none; border: none; color: var(--text-light);
      font-size: 14px; cursor: pointer; padding: 2px 6px;
    }
    .modal-close:hover { color: var(--pink-dark); }
    .modal-body { padding: 16px 14px; overflow-y: auto; flex: 1; font-size: 12px; line-height: 1.6; }
    .modal-footer {
      padding: 10px 14px; border-top: 1px solid #EEE;
      display: flex; justify-content: flex-end; gap: 6px;
    }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--acorn-dark); color: #FFF;
      padding: 10px 18px; border-radius: 20px;
      font-size: 12px; z-index: 9999;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      opacity: 0; transition: all .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---------- LEAFLET ---------- */
    .leaflet-routing-container { display: none !important; }
    .acorn-marker div {
      width: 20px; height: 20px; background: #C68B4A;
      border: 3px solid #fff; border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
    }
    .acorn-marker.user div { background: #A8D8FF; }

    /* ---------- MOBILE ---------- */
    @media (max-width: 720px) {
      body { flex-direction: column; }
      .sidebar { width: 100vw; height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
      #map { height: 50vh; flex: none; width: 100%; }
      .detail-panel { left: 0; max-height: 55vh; }
      .map-toolbox { top: auto; bottom: 16px; right: 16px; }
    }
  </style>
</head>
<body>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      DotoriMaps
      <small>도토리숲 지도</small>
    </div>

    <div class="sidebar-tabs">
      <div class="sidebar-tab active" onclick="switchTab(event, 'home')">
        <i class="fa-solid fa-house"></i> Explore
      </div>
      <div class="sidebar-tab" onclick="switchTab(event, 'search')">
        <i class="fa-solid fa-magnifying-glass"></i> Search
      </div>
      <div class="sidebar-tab" onclick="switchTab(event, 'directions')">
        <i class="fa-solid fa-diamond-turn-right"></i> Routes
      </div>
    </div>

    <!-- ---------- HOME / EXPLORE ---------- -->
    <div class="tab-content active" id="tab-home">
      <div class="input-group">
        <label>Search near me</label>
        <input type="text" id="home-search-input" class="search-box"
               placeholder="Search places near your location"
               autocomplete="off"
               oninput="searchNearMe(this.value)"
               onkeydown="searchKeyNav(event, 'home-search-results')">
        <div id="home-search-results" class="search-results-list"></div>
      </div>

      <div>
        <div class="section-title" style="margin-bottom:8px;">🌰 Filter nearby</div>
        <div class="category-grid">
          <div class="cat-btn" onclick="findNearby('restaurant')">
            <i class="fa-solid fa-utensils"></i><span>Food</span>
          </div>
          <div class="cat-btn" onclick="findNearby('cafe')">
            <i class="fa-solid fa-mug-hot"></i><span>Café</span>
          </div>
          <div class="cat-btn" onclick="findNearby('transit')">
            <i class="fa-solid fa-train-subway"></i><span>Transit</span>
          </div>
          <div class="cat-btn" onclick="findNearby('supermarket')">
            <i class="fa-solid fa-bag-shopping"></i><span>Groceries</span>
          </div>
          <div class="cat-btn" onclick="findNearby('park')">
            <i class="fa-solid fa-tree"></i><span>Parks</span>
          </div>
          <div class="cat-btn" onclick="findNearby('pharmacy')">
            <i class="fa-solid fa-prescription-bottle-medical"></i><span>Pharmacy</span>
          </div>
        </div>
        <button class="small-btn" id="reset-nearby-btn"
                style="margin-top:8px; width:100%; display:none;"
                onclick="loadMixedNearby(true)">
          <i class="fa-solid fa-arrow-rotate-left"></i> Back to mixed nearby
        </button>
      </div>

      <div class="section-title">
        <span id="nearby-title-text">🌰 Nearby</span>
        <span class="sort-chips" id="nearby-sort-chips" style="display:none;">
          <button class="sort-chip active" data-sort="distance">Distance</button>
          <button class="sort-chip" data-sort="name">Name</button>
        </span>
      </div>

      <div id="nearby-status" class="empty-state" style="padding: 0 0 6px 0;"></div>

      <div id="nearby-list">
        <div class="empty-state">
          <div class="spinner"></div>
          <div style="margin-top:8px;">Finding places near you…</div>
        </div>
      </div>
    </div>

    <!-- ---------- SEARCH ---------- -->
    <div class="tab-content" id="tab-search">
      <div class="input-group">
        <label>Search places</label>
        <input type="text" id="search-input" class="search-box"
               placeholder="e.g. Seoul Station, Starbucks"
               autocomplete="off"
               oninput="searchLocations(this.value, 'search-results')"
               onkeydown="searchKeyNav(event, 'search-results')">
        <div id="search-results" class="search-results-list"></div>
      </div>

      <div class="recent-label">RECENT SEARCHES</div>
      <div id="recent-searches" class="recent-searches">
        <span class="recent-chip" style="cursor:default; color:#BBB;">No searches yet</span>
      </div>
    </div>

    <!-- ---------- DIRECTIONS ---------- -->
    <div class="tab-content" id="tab-directions">
      <div class="input-group">
        <label>Start</label>
        <input type="text" id="start-input" class="search-box"
               placeholder="Start location"
               autocomplete="off"
               oninput="searchLocations(this.value, 'start-results')"
               onkeydown="searchKeyNav(event, 'start-results')">
        <div id="start-results" class="search-results-list"></div>
      </div>
      <div class="input-group">
        <label>Destination</label>
        <input type="text" id="end-input" class="search-box"
               placeholder="Destination"
               autocomplete="off"
               oninput="searchLocations(this.value, 'end-results')"
               onkeydown="searchKeyNav(event, 'end-results')">
        <div id="end-results" class="search-results-list"></div>
      </div>
      <button class="dotori-btn" onclick="getDirections()">
        <i class="fa-solid fa-route"></i> Get Directions
      </button>
      <button class="small-btn" onclick="clearRoute()" id="clear-route-btn" style="display:none;">
        <i class="fa-solid fa-xmark"></i> Clear route
      </button>
      <div id="route-summary" class="empty-state" style="display:none;"></div>
    </div>
  </aside>

  <!-- ============ MAP ============ -->
  <div id="map"></div>

  <!-- ============ DETAIL PANEL ============ -->
  <div id="detail-panel" class="detail-panel">
    <button class="detail-close" onclick="closeDetailPanel()" aria-label="Close">✕</button>

    <div class="detail-head">
      <div class="detail-photo" id="detail-photo">🌰</div>
      <div class="detail-head-text">
        <div class="detail-title" id="detail-name">Place Name</div>
        <span class="detail-category" id="detail-category">Location</span>
        <div class="detail-subtitle" id="detail-info"></div>
      </div>
    </div>

    <div class="detail-facts" id="detail-facts"></div>

    <div class="detail-actions">
      <button class="dotori-btn" onclick="routeToSelected()">
        <i class="fa-solid fa-diamond-turn-right"></i> Directions
      </button>
      <button class="small-btn" id="detail-save-btn" onclick="toggleSaveCurrent()">
        <i class="fa-regular fa-bookmark"></i> Save
      </button>
      <button class="small-btn" onclick="shareCurrent()">
        <i class="fa-solid fa-share-nodes"></i> Share
      </button>
    </div>

    <div class="detail-nearby" id="detail-nearby" style="display:none;">
      <div class="detail-nearby-title">🌰 Nearby</div>
      <div class="detail-nearby-grid" id="detail-nearby-grid"></div>
    </div>
  </div>

  <!-- ============ TOOLBOX ============ -->
  <div class="map-toolbox">
    <button class="toolbox-btn" id="map-login-btn" title="Account">👤</button>
    <button class="toolbox-btn" id="locate-btn" title="My location">📍</button>
    <button class="toolbox-btn" id="saved-btn" title="Saved places">🔖</button>
    <button class="toolbox-btn" id="zoom-in" title="Zoom in">➕</button>
    <button class="toolbox-btn" id="zoom-out" title="Zoom out">➖</button>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-title">Notice</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast"></div>

  <!-- ============ SCRIPTS ============ -->
